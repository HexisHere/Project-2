<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Follow the P · The Oval</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.4.0/dist/model-viewer.min.js"></script>
  <link rel="stylesheet" href="style.css?v=visible-arrow">
  <script defer src="stops.js"></script>
  <script defer src="game.js?v=visible-arrow"></script>
</head>
<body>
  <div class="world" aria-hidden="true">
    <video id="camera" autoplay muted playsinline hidden></video>
  </div>
  <main id="game-panel">
    <header>
      <p class="eyebrow">THE LITTLE P WORLD · THE OVAL</p>
      <h1>Follow the P</h1>
      <p class="intro">The Oval has lost its colors. Find the five little friends in order to reveal your trail.</p>
    </header>
    <section class="card" aria-label="Game progress">
      <div class="row"><strong id="count">0 / 5 colors</strong><button id="cameraToggle" type="button">Turn on camera</button></div>
      <ol id="colors"></ol>
      <p id="status" role="status"></p>
      <button class="primary" id="go" type="button">Start GPS walk</button>
      <button id="view" type="button" hidden>View latest find</button>
      <button id="finale" type="button" hidden></button>
      <section id="scout" hidden aria-label="Scout tools">
        <label for="slot">Stop to record</label>
        <select id="slot"></select>
        <button id="mark" type="button" disabled>Record GPS point</button>
        <label for="marks">Saved coordinates</label>
        <textarea id="marks" readonly rows="5"></textarea>
      </section>
      <section id="demo" hidden aria-label="Demo controls">
        <div class="row demo-heading">
          <span>Simulate an arrival</span>
          <button id="reset" type="button">Restart demo</button>
        </div>
        <div id="arrivals" class="row"></div>
      </section>
    </section>
    <figure class="trail-map">
      <figcaption>
        <strong>Your trail</strong>
        <span id="trail-status"></span>
      </figcaption>
      <svg id="map" viewBox="24 163 986 660" role="img" aria-labelledby="trail-title trail-status">
        <title id="trail-title">The Oval trail map</title>
        <image class="basemap" href="oval-watercolor.png" width="1693" height="929"/>
        <g id="trail-segments"></g>
        <g id="trail-stops"></g>
      </svg>
    </figure>
    <nav class="row" aria-label="Game modes">
      <a href="?">GPS game</a><a href="?demo">Desktop demo</a><a href="?scout">Scout points</a>
    </nav>
  </main>
  <aside id="camera-guide" aria-label="Direction to the next stop" hidden>
    <svg id="guide-arrow" viewBox="0 0 48 48" aria-hidden="true" hidden>
      <path d="M24 4 42 41 24 32 6 41Z"/>
    </svg>
    <span id="guide-label"></span>
  </aside>
  <aside id="camera-hud" aria-label="Camera controls" hidden>
    <p id="camera-status" role="status"></p>
    <div class="camera-actions">
      <strong id="camera-count">0 / 5</strong>
      <button id="camera-panel-toggle" type="button" aria-controls="game-panel" aria-expanded="false">Map &amp; game</button>
      <button id="camera-find" type="button" hidden>View find</button>
      <button id="camera-close" type="button">Close camera</button>
    </div>
    <button id="camera-bonus" type="button" hidden></button>
  </aside>
  <dialog id="reward">
    <div class="row"><h2 id="rewardTitle"></h2><form method="dialog"><button aria-label="Close find">Done</button></form></div>
    <p id="modelStatus" role="status"></p>
    <div id="preview"></div>
  </dialog>
</body>
</html>
